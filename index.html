<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css">

    <title>AJAX LEARNING</title>
</head>

<body>

    <nav class ="navbar navbar-dark bg-dark">
        <a href = "#" class="navbar-brand">AJAX Basics</a> 
    </nav>

    <div class="container mt-3">
        <div class="row">
            <div class="col text-center">
                <button class="btn btn-primary" id="text-btn">Text Data</button>
                <button class="btn btn-success" id="json-btn">JSON Data</button>
                <button class="btn btn-warning" id="api-btn">API Data</button>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-3">
    <div class="row">

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h3>Text Data</h3>
                </div>
                <div class="card-body" id="text-card">

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h3>JSON Data</h3>
                </div>
                <div class="card-body" id="json-card">

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h3>API Data</h3>
                </div>
                <div class="card-body" id="api-card">

                </div>
            </div>
        </div>

    </div>
</div>

    <script src="AJAX.js"></script>

</body>

</html>
